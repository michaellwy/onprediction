name: Broadcast New Articles

on:
  push:
    branches: [main]
    paths:
      - "articles_database.json"
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait for Vercel deployment
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN secret not set — skipping deployment check"
            exit 0
          fi

          SHA="${{ github.sha }}"
          echo "Waiting for Vercel deployment of commit $SHA to be READY..."
          for i in $(seq 1 18); do
            RESPONSE=$(curl -s "https://api.vercel.com/v1/deployments?project=onprediction&limit=10" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
            DEPLOYMENT=$(echo "$RESPONSE" | jq -r "[.deployments[] | select(.meta.githubCommitSha == \"$SHA\" and .state == \"READY\")] | first // empty")
            if [ -n "$DEPLOYMENT" ]; then
              URL=$(echo "$DEPLOYMENT" | jq -r '.url')
              echo "Deployment ready at https://$URL"
              exit 0
            fi
            echo "Attempt $i/18: not ready yet, waiting 10s..."
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment"
          exit 1

      - name: Broadcast new articles
        run: node scripts/broadcast-new-articles.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BROADCAST_CHAT_ID: ${{ secrets.TELEGRAM_BROADCAST_CHAT_ID }}
