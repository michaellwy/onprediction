<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thumbnail</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .card {
    width: 1200px;
    height: 675px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 100px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .headline {
    font-weight: 900;
    font-size: 82px;
    line-height: 1.1;
    color: #fff;
    letter-spacing: -0.03em;
    text-align: center;
  }

  .red {
    color: #dc2626;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="headline">
      use this prompt to <span class="red">10x</span><br>
      your prompting skill
    </div>
  </div>
</body>
</html>
